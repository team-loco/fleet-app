[workspace]
resolver = "3"
members = [
  "apps/fleet",
  "crates/fleet-core",
  "crates/fleet-demo",
  "crates/fleet-flux",
  "crates/fleet-kube",
  "crates/fleet-loco",
  "crates/fleet-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/nikumar1206/fleet-app"
publish = false

[workspace.dependencies]
fleet-core = { path = "crates/fleet-core" }
fleet-demo = { path = "crates/fleet-demo" }
fleet-flux = { path = "crates/fleet-flux" }
fleet-kube = { path = "crates/fleet-kube" }
fleet-loco = { path = "crates/fleet-loco" }
fleet-ui = { path = "crates/fleet-ui" }

anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "0.7.3"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
