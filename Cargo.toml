[workspace]
resolver = "3"
members = [
  "apps/fleet",
  "apps/fleet-shots",
  "crates/fleet-core",
  "crates/fleet-demo",
  "crates/fleet-flux",
  "crates/fleet-kube",
  "crates/fleet-loco",
  "crates/fleet-ui",
  "crates/fleet-update",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/team-loco/fleet-app"
publish = false

[workspace.dependencies]
fleet = { path = "apps/fleet" }
fleet-core = { path = "crates/fleet-core" }
fleet-demo = { path = "crates/fleet-demo" }
fleet-flux = { path = "crates/fleet-flux" }
fleet-kube = { path = "crates/fleet-kube" }
fleet-loco = { path = "crates/fleet-loco" }
fleet-ui = { path = "crates/fleet-ui" }
fleet-update = { path = "crates/fleet-update" }

anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
dhat = "0.3.3"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
gpui-component = "0.7.3"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.38"
json-patch = "4.2.0"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "ws", "jsonpatch"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
serde_norway = "0.9.42"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tower-service = "0.3.3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flate2 = "1.1.10"
base64 = "0.23.1"
similar = "3.2.0"
vt100 = "0.16.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
