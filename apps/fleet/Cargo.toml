[package]
name = "fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.bundle]
name = "Fleet"
identifier = "dev.fleet.app"
icon = ["apps/fleet/resources/Fleet.icns"]
category = "Developer Tool"
copyright = "Copyright © 2026 Fleet contributors"
short_description = "Watch many Kubernetes clusters at once"

[package.metadata.bundle.osx]
minimum_system_version = "13.0"

[[bin]]
name = "fleet"
path = "src/main.rs"

[features]
loco = ["dep:fleet-loco", "fleet-core/loco", "fleet-demo/loco", "fleet-kube/loco", "fleet-ui/loco"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
fleet-core.workspace = true
fleet-demo.workspace = true
fleet-kube.workspace = true
fleet-loco = { workspace = true, optional = true }
fleet-ui.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
