apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./kustomize
  prune: true
  wait: true
  targetNamespace: web
  sourceRef:
    kind: GitRepository
    name: podinfo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: broken-kustomization
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  path: ./fleet-nonexistent-path
  prune: true
  targetNamespace: web
  sourceRef:
    kind: GitRepository
    name: podinfo
