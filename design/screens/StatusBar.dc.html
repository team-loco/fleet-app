<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<footer style="{{vars}}position:relative;height:26px;width:100%;box-sizing:border-box;border-top:1px solid var(--line);background:var(--chrome);display:flex;align-items:center;gap:16px;padding:0 0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);white-space:nowrap">
  <a href="Flock.dc.html" style="display:flex;gap:10px;text-decoration:none"><span style="color:var(--err)">✕ 3</span><span style="color:var(--warn)">▲ 6</span></a>
  <span style="overflow:hidden;text-overflow:ellipsis">{{left}}</span>
  <span style="flex:1"></span>
  <sc-if value="{{hasAgent}}" hint-placeholder-val="{{ false }}"><a href="LocoPlatform.dc.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute)"><span style="color:var(--ok)">●</span>loco agent · synced {{agent}}</a></sc-if>
  <button onClick="{{toggle}}" aria-haspopup="menu" aria-expanded="{{open}}" title="Switch cluster  ⌘⇧C" style="height:25px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-left:1px solid var(--line);background:{{btnBg}};color:var(--fg);font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{cur.c}}">{{cur.g}}</span>{{cur.name}}
    <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--mute)"><path d="m4 10 4-4 4 4"/></svg>
  </button>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div role="menu" aria-label="Clusters" style="position:absolute;right:6px;bottom:30px;width:290px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;box-shadow:0 12px 32px var(--shadow);padding:4px;z-index:20;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--fg)">
      <a role="menuitem" href="Flock.dc.html" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:3px;text-decoration:none;color:var(--fg);{{flockStyle}}"><span style="width:10px"></span>All clusters<span style="flex:1"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)">⌘0</span></a>
      <div style="height:1px;background:var(--line);margin:4px 2px"></div>
      <sc-for list="{{clusters}}" as="c" hint-placeholder-count="6">
        <div onMouseEnter="{{c.enter}}" style="display:flex;align-items:center;border-radius:3px;{{c.rowBg}}">
          <a role="menuitem" href="{{c.href}}" style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;text-decoration:none;color:{{c.fc}}">
            <span style="width:10px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{c.dot}}">{{c.g}}</span>
            <span style="overflow:hidden;text-overflow:ellipsis">{{c.name}}</span>
            <span style="flex:1"></span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:{{c.mc}}">{{c.meta}}</span>
          </a>
          <button aria-label="{{c.gearLabel}}" title="Cluster settings" style="width:26px;height:24px;margin-right:2px;border:0;border-radius:3px;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;{{c.gear}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"/></svg></button>
        </div>
      </sc-for>
      <div style="height:1px;background:var(--line);margin:4px 2px"></div>
      <a role="menuitem" href="AddCluster.dc.html" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:3px;text-decoration:none;color:var(--fg2)"><span style="width:10px;color:var(--mute)">+</span>Add cluster…</a>
    </div>
  </sc-if>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","dark","light"],"default":"system"},"left":{"editor":"text","default":"5 of 6 clusters connected"},"agent":{"editor":"text","default":""},"cluster":{"editor":"enum","options":["flock","prod-us-east"],"default":"flock"},"open":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":26}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: !!props.open, hover: props.open ? 'pw' : '' };
  }
  vars() {
    let t = this.props.theme ?? 'system';
    if (t !== 'dark' && t !== 'light') { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
    const D = '--editor:#111317;--panel:#15181D;--chrome:#1A1D22;--raise:#20242A;--hover:#1D2127;--line:#262A30;--line2:#323740;--guide:#2A2E35;--fg:#DCDFE4;--fg2:#B3B9C3;--mute:#8E96A3;--sep:#4C525C;--sel:#1F2C40;--selfg:#F2F6FC;--selline:#3A5A8C;--acc:#74ADFF;--onacc:#0C1220;--ok:#48C78E;--warn:#E8B04B;--err:#F26D6D;--sus:#9AA2AE;--okbg:rgba(72,199,142,.10);--errbg:rgba(242,109,109,.11);--warnbg:rgba(232,176,75,.10);--accbg:rgba(116,173,255,.12);--addbg:rgba(72,199,142,.12);--delbg:rgba(242,109,109,.13);--addfg:#7FDDB2;--delfg:#FF9C9C;--shadow:rgba(0,0,0,.5);color-scheme:dark;';
    const L = '--editor:#FFFFFF;--panel:#F6F7F8;--chrome:#EEEFF1;--raise:#E9EBEE;--hover:#F1F2F4;--line:#E1E3E7;--line2:#CFD3D9;--guide:#E4E6EA;--fg:#1D2027;--fg2:#3B414B;--mute:#5F6774;--sep:#A5ABB5;--sel:#DCE7FA;--selfg:#0D2850;--selline:#8DB0EA;--acc:#1F5FD1;--onacc:#FFFFFF;--ok:#167A4C;--warn:#935800;--err:#C53030;--sus:#6B7280;--okbg:rgba(22,122,76,.08);--errbg:rgba(197,48,48,.07);--warnbg:rgba(147,88,0,.08);--accbg:rgba(31,95,209,.08);--addbg:rgba(22,122,76,.10);--delbg:rgba(197,48,48,.09);--addfg:#0F5E3A;--delfg:#A12626;--shadow:rgba(20,24,32,.18);color-scheme:light;';
    return { theme: t, vars: t === 'light' ? L : D };
  }
  renderVals() {
    const G = { ok: '●', err: '✕', warn: '▲', off: '○' };
    const C = { ok: 'var(--ok)', err: 'var(--err)', warn: 'var(--warn)', off: 'var(--mute)' };
    const curId = this.props.cluster === 'prod-us-east' ? 'pe' : 'flock';
    const list = [
      { id: 'pe', name: 'prod-us-east', s: 'err', meta: '✕2 ▲3', mc: 'var(--err)' },
      { id: 'pw', name: 'prod-eu-west', s: 'ok', meta: '‖1', mc: 'var(--sus)' },
      { id: 'st', name: 'staging', s: 'warn', meta: '▲2', mc: 'var(--warn)' },
      { id: 'dv', name: 'dev-kind', s: 'ok', meta: '', mc: 'var(--mute)' },
      { id: 'qa', name: 'qa-gke', s: 'err', meta: 'auth expired', mc: 'var(--err)' },
      { id: 'ek', name: 'edge-k3s', s: 'off', meta: 'offline', mc: 'var(--mute)' }
    ];
    const hover = this.state.hover;
    const clusters = list.map((c) => {
      const on = c.id === curId;
      const hv = c.id === hover;
      return {
        name: c.name, g: G[c.s], dot: C[c.s], meta: c.meta, mc: c.mc,
        href: c.id === 'pe' ? 'Workload.dc.html' : '#',
        fc: c.s === 'off' ? 'var(--mute)' : 'var(--fg)',
        rowBg: on ? 'background:var(--sel);' : (hv ? 'background:var(--hover);' : ''),
        gear: hv || on ? 'opacity:1;' : 'opacity:0;',
        gearLabel: c.name + ' settings',
        enter: () => { if (this.state.hover !== c.id) this.setState({ hover: c.id }); }
      };
    });
    const cur = curId === 'flock' ? { name: 'All clusters', g: '', c: 'var(--mute)' } : { name: 'prod-us-east', g: '✕', c: 'var(--err)' };
    const agent = this.props.agent ?? '';
    const open = this.state.open;
    return {
      vars: this.vars().vars,
      left: this.props.left ?? '5 of 6 clusters connected',
      agent, hasAgent: !!agent,
      open, cur, clusters,
      btnBg: open ? 'var(--sel)' : 'transparent',
      flockStyle: curId === 'flock' ? 'background:var(--sel);' : '',
      toggle: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
