<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hotbar and cluster navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{vars}}font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:var(--fg);width:100%;min-height:834px;height:100%;display:flex;background:var(--panel2);border-right:1px solid var(--line);box-sizing:border-box">
  <nav aria-label="Clusters" style="width:52px;flex:none;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0">
    <a href="Catalog.dc.html" aria-label="Catalog" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg2);background:var(--raise);text-decoration:none;{{homeRing}}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
    </a>
    <div style="width:24px;height:1px;background:var(--line)"></div>
    <sc-for list="{{clusters}}" as="c" hint-placeholder-count="5">
      <a href="Main.dc.html" aria-label="{{c.name}}" title="{{c.name}}" style="position:relative;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.02em;color:#FFFFFF;text-decoration:none;background:{{c.bg}};{{c.ring}}">{{c.ini}}<span style="position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:{{c.dot}};border:2px solid var(--chrome)"></span></a>
    </sc-for>
    <button aria-label="Add cluster" style="width:32px;height:32px;border-radius:8px;border:1px dashed var(--line2);background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <div style="flex:1"></div>
    <a href="Compare.dc.html" aria-label="Compare across clusters" title="Compare across clusters" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg2);text-decoration:none;{{cmpRing}}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="2.5" width="5" height="11" rx="1"/><rect x="9.25" y="2.5" width="5" height="11" rx="1"/></svg>
    </a>
    <button aria-label="Settings" style="width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--fg2);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"/></svg>
    </button>
  </nav>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <sc-if value="{{isCluster}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;flex:1">
        <div style="padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;align-items:center;gap:8px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>prod-us-east</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);padding-left:16px">EKS · us-east-1 · v1.31.2</div>
        </div>
        <div style="padding:8px;display:flex;flex-direction:column;gap:1px;flex:1">
          <a href="Main.dc.html" style="{{st.overview}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13.5h12M4 11V7M8 11V3.5M12 11V5.5"/></svg><span style="flex:1">Overview</span></a>
          <button style="{{st.nodes}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1"/><rect x="2" y="9" width="12" height="4.5" rx="1"/></svg><span style="flex:1">Nodes</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">14</span></button>
          <button style="{{st.workloads}}" aria-expanded="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.75 13.5 4.75v6.5L8 14.25 2.5 11.25v-6.5z"/><path d="M2.5 4.75 8 7.75l5.5-3M8 7.75v6.5"/></svg><span style="flex:1">Workloads</span><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--mute)"><path d="m4 6 4 4 4-4"/></svg></button>
          <a href="Pods.dc.html" style="{{st.pods}}"><span style="flex:1">Pods</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--err)">5</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">412</span></a>
          <a href="Compare.dc.html" style="{{st.deployments}}"><span style="flex:1">Deployments</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">48</span></a>
          <button style="{{st.statefulsets}}"><span style="flex:1">StatefulSets</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">12</span></button>
          <button style="{{st.daemonsets}}"><span style="flex:1">DaemonSets</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">9</span></button>
          <button style="{{st.jobs}}"><span style="flex:1">Jobs</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">31</span></button>
          <button style="{{st.cronjobs}}"><span style="flex:1">CronJobs</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">14</span></button>
          <button style="{{st.config}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.5" fill="var(--panel2)"/><circle cx="10" cy="8" r="1.5" fill="var(--panel2)"/><circle cx="5" cy="12" r="1.5" fill="var(--panel2)"/></svg><span style="flex:1">Config</span></button>
          <button style="{{st.network}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="3.5" r="1.75"/><circle cx="3.5" cy="12" r="1.75"/><circle cx="12.5" cy="12" r="1.75"/><path d="M7.1 5 4.4 10.5M8.9 5l2.7 5.5M5.25 12h5.5"/></svg><span style="flex:1">Network</span></button>
          <button style="{{st.storage}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="8" cy="3.75" rx="5" ry="1.75"/><path d="M3 3.75v8.5c0 1 2.2 1.75 5 1.75s5-.75 5-1.75v-8.5M3 8c0 1 2.2 1.75 5 1.75S13 9 13 8"/></svg><span style="flex:1">Storage</span></button>
          <button style="{{st.namespaces}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 14 5 8 8 2 5z"/><path d="m2 8 6 3 6-3M2 11l6 3 6-3"/></svg><span style="flex:1">Namespaces</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">23</span></button>
          <button style="{{st.events}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z"/><path d="M6.5 14h3"/></svg><span style="flex:1">Events</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--warn)">7</span></button>
          <button style="{{st.helm}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><circle cx="8" cy="8" r="1.25"/><path d="M8 1.5V4M8 12v2.5M1.5 8H4M12 8h2.5"/></svg><span style="flex:1">Helm</span></button>
          <button style="{{st.access}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.75 13 3.5v4c0 3.2-2.2 5.6-5 6.75C5.2 13.1 3 10.7 3 7.5v-4z"/></svg><span style="flex:1">Access control</span></button>
          <button style="{{st.crd}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 2.5c-1.5 0-2 .75-2 2v1.75c0 .9-.5 1.5-1.5 1.75 1 .25 1.5.85 1.5 1.75v1.75c0 1.25.5 2 2 2M10.5 2.5c1.5 0 2 .75 2 2v1.75c0 .9.5 1.5 1.5 1.75-1 .25-1.5.85-1.5 1.75v1.75c0 1.25-.5 2-2 2"/></svg><span style="flex:1">Custom resources</span></button>
        </div>
        <div style="border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)">Port forwards</div>
          <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px"><span style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">svc/checkout-api</span><span style="color:var(--acc)">:8080</span></div>
          <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px"><span style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">svc/grafana</span><span style="color:var(--acc)">:3000</span></div>
          <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px"><span style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">pod/payments-db-0</span><span style="color:var(--acc)">:5432</span></div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isCatalog}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;flex:1">
        <div style="padding:14px 14px 10px;border-bottom:1px solid var(--line);font-weight:600">Catalog</div>
        <div style="padding:8px;display:flex;flex-direction:column;gap:1px">
          <button style="{{st.all}}"><span style="flex:1">Browse all</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">16</span></button>
          <a href="Catalog.dc.html" style="{{st.clusters}}"><span style="flex:1">Clusters</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">7</span></a>
          <button style="{{st.helmrepos}}"><span style="flex:1">Helm repositories</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">4</span></button>
          <button style="{{st.links}}"><span style="flex:1">Web links</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">2</span></button>
        </div>
        <div style="padding:14px 14px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)">Kubeconfig sources</div>
        <div style="padding:0 8px;display:flex;flex-direction:column;gap:1px;font-family:'IBM Plex Mono',monospace;font-size:12px">
          <button style="{{st.src1}}"><span style="flex:1">~/.kube/config</span><span style="color:var(--mute)">3</span></button>
          <button style="{{st.src2}}"><span style="flex:1">~/.kube/eks/*.yaml</span><span style="color:var(--mute)">3</span></button>
          <button style="{{st.src3}}"><span style="flex:1">~/.kube/kind-dev.yaml</span><span style="color:var(--mute)">1</span></button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","dark","light"],"default":"system"},"active":{"editor":"enum","options":["overview","nodes","pods","deployments","events","clusters"],"default":"overview"},"mode":{"editor":"enum","options":["cluster","catalog","compare"],"default":"cluster"},"$preview":{"width":268,"height":834}}'>
class Component extends DCLogic {
  resolveTheme() {
    const t = this.props.theme ?? 'system';
    if (t === 'dark' || t === 'light') return t;
    try { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; }
  }
  themeVars(t) {
    const d = { bg:'#0D0F12', chrome:'#0B0D10', panel:'#13161B', panel2:'#111419', raise:'#1C2129', line:'#252A33', line2:'#2C323C', fg:'#D7DCE3', fg2:'#B9C0CB', mute:'#8B93A1', sep:'#4B5260', sel:'#1D2A3F', selfg:'#FFFFFF', acc:'#6AA6FF', onacc:'#0B0D10', ok:'#3FC58A', warn:'#F0B24A', err:'#FF6B6B', ai:'#B48CFF', track:'#1F242C', hover:'#171B21', okbg:'rgba(63,197,138,.13)', errbg:'rgba(255,107,107,.13)', warnbg:'rgba(240,178,74,.12)', accbg:'rgba(106,166,255,.14)' };
    const l = { bg:'#F6F7F9', chrome:'#ECEEF2', panel:'#FFFFFF', panel2:'#FAFBFC', raise:'#F0F2F5', line:'#DDE1E7', line2:'#CDD2DA', fg:'#1B1F26', fg2:'#3A414C', mute:'#5E6673', sep:'#A3AAB5', sel:'#DCE8FB', selfg:'#0B2A57', acc:'#2563D9', onacc:'#FFFFFF', ok:'#17784B', warn:'#9A5B00', err:'#C93434', ai:'#7C4DDB', track:'#E6E9EE', hover:'#F1F3F6', okbg:'rgba(23,120,75,.10)', errbg:'rgba(201,52,52,.09)', warnbg:'rgba(154,91,0,.10)', accbg:'rgba(37,99,217,.10)' };
    const m = t === 'light' ? l : d;
    return Object.keys(m).map((k) => '--' + k + ':' + m[k] + ';').join('') + 'color-scheme:' + t + ';';
  }
  renderVals() {
    const active = this.props.active ?? 'overview';
    const mode = this.props.mode ?? 'cluster';
    const base = 'display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--fg2);text-decoration:none;background:transparent;border:0;width:100%;box-sizing:border-box;cursor:pointer;font-family:inherit;text-align:left;';
    const sub = ['pods','deployments','statefulsets','daemonsets','jobs','cronjobs'];
    const keys = ['overview','nodes','workloads','pods','deployments','statefulsets','daemonsets','jobs','cronjobs','config','network','storage','namespaces','events','helm','access','crd','all','clusters','helmrepos','links','src1','src2','src3'];
    const st = {};
    keys.forEach((k) => {
      let s = base;
      if (sub.indexOf(k) >= 0) s += 'padding-left:33px;';
      if (k.indexOf('src') === 0) s += 'font-family:inherit;font-size:12px;';
      if (k === active) s += 'background:var(--sel);color:var(--selfg);font-weight:500;';
      st[k] = s;
    });
    const ring = 'box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--acc);';
    const cur = mode === 'catalog' ? '' : 'pe';
    const list = [
      { id:'pe', ini:'PE', name:'prod-us-east', bg:'#2F5D9E', dot:'var(--ok)' },
      { id:'pw', ini:'PW', name:'prod-eu-west', bg:'#6A4C9C', dot:'var(--ok)' },
      { id:'st', ini:'ST', name:'staging', bg:'#2E7D62', dot:'var(--warn)' },
      { id:'qa', ini:'QA', name:'qa-gke (auth expired)', bg:'#7A3B4B', dot:'var(--err)' },
      { id:'dv', ini:'DV', name:'dev-kind', bg:'#8A5A2B', dot:'var(--ok)' }
    ];
    const clusters = list.map((c) => ({ ...c, ring: c.id === cur || (mode === 'compare' && (c.id === 'pw' || c.id === 'st')) ? ring : '' }));
    return {
      vars: this.themeVars(this.resolveTheme()),
      st, clusters,
      isCluster: mode !== 'catalog',
      isCatalog: mode === 'catalog',
      homeRing: mode === 'catalog' ? ring : '',
      cmpRing: mode === 'compare' ? 'background:var(--sel);color:var(--selfg);' : ''
    };
  }
}
</script>
</body>
</html>
